name = "msh-lead"
main = "src/index.js"
compatibility_date = "2026-08-16"

# Секреты задаются отдельно, в репозитории их нет:
#   wrangler secret put TG_BOT_TOKEN        — токен бота от @BotFather
#   wrangler secret put TG_CHAT_IDS         — chat_id получателей через запятую
#   wrangler secret put SHEET_WEBHOOK_URL   — необязательно: Apps Script для листа заявок
#
# Домен mediashkola.pro в Cloudflare стоит серым облаком (DNS-only, трафик идёт прямо
# на GitHub Pages), поэтому маршрут вида mediashkola.pro/api/* НЕ сработает — воркер
# живёт на своём workers.dev и вызывается из браузера через CORS.
workers_dev = true
